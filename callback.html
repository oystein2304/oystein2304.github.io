<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected – Shorts Uploader</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{word-break:break-all;background:#f3f3f3;padding:2px 4px}</style>
</head><body>
<h1>Shorts Uploader</h1>
<p id="msg">Finishing sign-in…</p>
<script>
const p=new URLSearchParams(location.search);
const m=document.getElementById('msg');
if(p.get('code')){m.innerHTML='TikTok account connected. Authorization code:<br><code></code>';m.querySelector('code').textContent=p.get('code');}
else if(p.get('error')){m.textContent='Sign-in failed: '+p.get('error');}
else{m.textContent='Nothing to show here.';}
</script>
</body></html>
